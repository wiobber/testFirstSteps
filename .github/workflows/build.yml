name: Build and publish a Ximera repo

on:
  push:
    branches:
      - luaxake

jobs:
  build-ximera:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100   # random number > 1 ...?

      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: | 
            /tmp/.buildx-cache
            **/*.html
            **/*.pdf
            **/*.svg
            **/*.aux
            **/*.xref
            **/*.toc
            !xmPictures/**
            !.git/**
            !.github/**
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
            ${{ runner.os }}-

      - name: Set cache key
        run: |
          echo "CACHE_KEY=${{ runner.os }}-buildx-${{ github.sha }}" >> $GITHUB_ENV
          echo "CACHE_KEY=${{ runner.os }}-buildx-${{ github.sha }}" 
        id: cache-key

      - name: Log cache key
        run: | 
          echo "Cache key used: ${{ env.CACHE_KEY }}"
        id: log-key


      - name: Build and publish Ximera courses
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          XIMERA_NAME: fromaction
        run: |
          ls -alrt xmScripts
          ls -alrt
          ./xmScripts/xmlatex ghaction --compile draft.html
          # ls -alrt
          # cat luaxake.log
