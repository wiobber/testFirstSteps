name: Build and publish a Ximera repo

on:
  push:
    branches:
      - luaxake

jobs:
  run-in-docker:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Pull and Run Docker Image
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          XIMERA_NAME: fromaction
        run: |
          ls -alrt
          # A="${GPG_KEY:10:60}"
          # echo "I=${GPG_KEY_ID:0:10}"
          # echo "K=${GPG_KEY:0:20}"
          # echo "A=${A:0:20}"
          ./xmScripts/xmlatex bake -t --compile draft.html test.tex 
          # ls -alrt
          ./xmScripts/xmlatex -d name | tee -a name.log || echo FAILED
          # cat name.log
          ./xmScripts/xmlatex frost test.tex 
          ./xmScripts/xmlatex serve
          ls -alrt
          # cat luaxake.log